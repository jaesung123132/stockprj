name: paper-trading

# 가상 매매 현황(paper/)을 매일 갱신하고, 새 월말 신호가 나오면 매매 안내 이슈를 만든다.
# 실제 주문은 내지 않는다.
# 멈추려면: Actions 탭 -> paper-trading -> 오른쪽 위 "..." -> Disable workflow
on:
  schedule:
    # 월~금 22:37 UTC = 한국 시간 화~토 오전 7:37. 미국과 한국 장이 모두 마감된 뒤다.
    - cron: "37 22 * * 1-5"
  workflow_dispatch:
  push:
    paths:
      - "paper_trade.py"
      - "quant/paper.py"
      - "configs/**"
      - ".github/workflows/paper.yml"

permissions:
  contents: write
  issues: write

concurrency:
  group: paper-trading
  cancel-in-progress: false

jobs:
  paper:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      # 실행을 시작하는 시점의 브랜치 최신 상태를 받는다. (이벤트가 생긴 시점의 커밋을 받으면,
      # 그 사이 앞선 실행이 올린 기록과 충돌한다.)
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: 패키지 설치
        run: pip install -r requirements.txt

      - name: 가상 매매 현황 갱신
        run: |
          status=0
          for config in configs/*.json; do
            echo "::group::$config"
            python paper_trade.py --config "$config" || status=1
            echo "::endgroup::"
          done
          exit $status

      - name: 새 월말 신호가 있으면 매매 안내 이슈 만들기
        env:
          GH_TOKEN: ${{ github.token }}
          OWNER: ${{ github.repository_owner }}
        run: |
          for notice in paper/*/notice.md; do
            [ -f "$notice" ] || continue
            title="$(head -n 1 "$notice" | sed 's/^# //')"
            if gh issue list --state all --limit 500 --json title --jq '.[].title' | grep -Fxq "$title"; then
              echo "이미 안내했습니다: $title"
            else
              tail -n +2 "$notice" > "$RUNNER_TEMP/body.md"
              gh issue create --title "$title" --body-file "$RUNNER_TEMP/body.md" --assignee "$OWNER"
            fi
          done

      - name: 현황을 저장소에 커밋
        if: always()
        run: |
          mkdir -p paper
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A paper
          if git diff --cached --quiet; then
            echo "바뀐 내용이 없습니다."
            exit 0
          fi
          git commit -m "Update paper trading status [skip ci]"
          git pull --rebase origin "$GITHUB_REF_NAME"
          git push origin "HEAD:$GITHUB_REF_NAME"
